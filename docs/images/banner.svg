      <text x="74" y="27" text-anchor="middle">ledger</text>
    </g>
    <path d="M422 314h26" stroke="#ee6c4d" stroke-width="2"/>
    <g transform="translate(456,292)">
      <rect width="148" height="44" rx="8" fill="#2a2019" stroke="#4a3a2d"/>
      <text x="74" y="27" text-anchor="middle">controls</text>
    </g>
    <path d="M612 314h26" stroke="#ee6c4d" stroke-width="2"/>
    <g transform="translate(646,292)">
      <rect width="148" height="44" rx="8" fill="#2a2019" stroke="#4a3a2d"/>
