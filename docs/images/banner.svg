<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Shimline — evidence-native bookkeeping automation engine</title>
  <desc id="d">QuickBooks Online ingestion, double-entry reconstruction, deterministic controls, human-approved write-back and reconciliation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15110d"/>
      <stop offset="1" stop-color="#231a14"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2e241c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.55"/>

  <text x="72" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#f3e9da">Shimline<tspan fill="#ee6c4d">.</tspan></text>
  <text x="76" y="202" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#d9c7ae">Evidence-native bookkeeping automation engine</text>
  <text x="76" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#9c8a74">QuickBooks Online · double-entry reconstruction · deterministic controls · approval-gated write-back</text>

